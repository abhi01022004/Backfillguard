# Serves the built SPA and proxies the API and the live socket to the backend container.
#
# This mirrors the Vite dev server's proxy on purpose: in development the browser talks to
# localhost:5173 and /api and /live are proxied to :4000, so everything is same-origin. Reproducing
# that here means the app runs in a container with the same origin semantics it has in development —
# no CORS preflight, and the Socket.IO client can keep using a relative path.

upstream backfillguard_api {
    # `backend` is the compose service name, resolved by Docker's embedded DNS.
    server backend:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container-local liveness target, so the healthcheck never depends on the backend being up.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- API
    location /api {
        proxy_pass http://backfillguard_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A scripted demo run takes roughly 19 seconds and the verification endpoint re-reads every
        # ledger, so the default 60s read timeout is closer to the real duration than is comfortable.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Responses stream out as they are produced rather than being buffered whole.
        proxy_buffering off;
    }

    # ---------------------------------------------------------------- live socket
    location /live {
        proxy_pass http://backfillguard_api;
        proxy_http_version 1.1;

        # The two headers that make a websocket upgrade work. Without them Socket.IO silently falls
        # back to HTTP long-polling: the dashboard still updates, just less promptly and with far more
        # requests — which is exactly the kind of degradation nobody notices until a demo feels slow.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # An idle socket between demo runs must not be culled; the client would reconnect and refetch
        # a snapshot for no reason.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------- static assets
    # Vite emits content-hashed filenames, so these can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell must never be cached, or a deploy leaves browsers loading an old bundle that
    # references asset filenames the server no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
